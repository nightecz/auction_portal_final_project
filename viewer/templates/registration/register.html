{% extends 'base.html' %}

{% block nadpis %} - Registration{% endblock %}

{% block content %}
<h2>Please register yourself</h2>
<div class="create-box">
    <form method ="post">
        {% csrf_token %}
        {% if form.errors %}
            <div class="message">
            {% for error in form.errors %}
                {{ error }}
            {% endfor %}
            </div>
        {% endif %}
        {{ form.as_p }}



        <button type="submit" class="search-btn">Register</button>

    </form>
</div>
{% endblock %}
