{% extends 'base.html' %}

{% block title %}
    Confirm Sale
{% endblock %}

{% block content %}
<div class="container">
    <h1>Confirm Sale for {{ purchase.auction.name }}</h1>
    <p>Buyer: {{ purchase.buyer.user.username }}</p>
    <p>Winning Price: {{ purchase.winning_price }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Confirm Sale</button>
    </form>
</div>
{% endblock %}
